name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generated operations match spec/openapi.json
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: |
          npm run sync-spec -- --offline
          git diff --exit-code -- spec src/generated
      - name: Package contents
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run
      - run: npm run test:package

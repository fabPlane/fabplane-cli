name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generated operations match spec/openapi.json
        if: matrix.node == 22
        run: |
          npm run sync-spec -- --offline
          git diff --exit-code -- spec src/generated
      - name: Package contents
        if: matrix.node == 22
        run: npm pack --dry-run

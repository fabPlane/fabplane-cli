name: Sync API spec

# Weekly: fetch the fabplane OpenAPI document, regenerate src/generated/operations.ts and open
# (or update) a PR when anything changed. Until the API serves /v1/public/openapi.json the fetch
# 404s and the job ends green without changes.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub App credentials
        env:
          FABPLANE_CLI_SYNC_APP_ID: ${{ vars.FABPLANE_CLI_SYNC_APP_ID }}
          FABPLANE_CLI_SYNC_APP_PRIVATE_KEY: ${{ secrets.FABPLANE_CLI_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$FABPLANE_CLI_SYNC_APP_ID" ] || [ -z "$FABPLANE_CLI_SYNC_APP_PRIVATE_KEY" ]; then
            echo "::error title=GitHub App credentials missing::Set FABPLANE_CLI_SYNC_APP_ID (variable) and FABPLANE_CLI_SYNC_APP_PRIVATE_KEY (secret). See the README's 'API spec sync' section."
            exit 1
          fi
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FABPLANE_CLI_SYNC_APP_ID }}
          private-key: ${{ secrets.FABPLANE_CLI_SYNC_APP_PRIVATE_KEY }}
          owner: fabPlane
          repositories: fabplane-cli
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch spec and regenerate
        id: sync
        env:
          FABPLANE_API_ORIGIN: ${{ vars.FABPLANE_API_ORIGIN || 'https://api.fabplane.com' }}
        run: npm run sync-spec
      - name: Build and test against the new spec
        id: test
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: npm run build && npm test
      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/api-sync
          delete-branch: true
          commit-message: "chore: sync fabplane API spec"
          title: "chore: sync fabplane API spec"
          add-paths: |
            spec/openapi.json
            src/generated/operations.ts
          body: |
            Automated weekly sync of `spec/openapi.json` from `/v1/public/openapi.json`.

            ${{ steps.sync.outputs.report }}

            Tests against the new spec: **${{ steps.test.outcome }}**. A failing spec-coverage test means an
            operation needs a `FabplaneClient` method (see "Missing FabplaneClient methods" above).

            PRs opened with the sync token trigger CI automatically.

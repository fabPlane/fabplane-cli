# Publishes fabplane-cli to npm on version tags. One-time setup (not done here):
# add the NPM_TOKEN repository secret, then push a v* tag that matches package.json.
# See "Publishing" in README.md. Without the secret this workflow fails on its first
# step and publishes nothing.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# A release and its tag can both fire; the second run sees the version on npm and skips.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check NPM_TOKEN
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::Please add the NPM_TOKEN repository secret (Settings → Secrets and variables → Actions) to publish fabplane-cli to npm."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - name: Tag matches package.json
        if: steps.token.outputs.present == 'true' && github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$name" != "fabplane-cli" ]; then
            echo "::error::package.json name is $name; expected fabplane-cli"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi
      - name: Skip versions already on npm
        id: published
        if: steps.token.outputs.present == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url);
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Registry lookup failed: HTTP ${response.status}; refusing to publish`);
          }
          if (response.status === 200) {
            console.log(`${name}@${version} is already published; nothing to do.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status === 200}\n`);
          NODE
      - run: npm run build && npm test && npm run test:package
        if: steps.token.outputs.present == 'true' && steps.published.outputs.exists == 'false'
      - name: npm publish
        if: steps.token.outputs.present == 'true' && steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
